<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- AGM: 운영자/참가자 PWA 분리 가드
      - 같은 도메인에서 운영자 아이콘과 참가자 아이콘을 각각 홈화면에 추가할 때
        브라우저가 잘못된 start_url/manifest를 잡아 반대 로그인으로 열리는 문제를 막기 위한 초기 스크립트입니다.
      - React가 실행되기 전에 현재 URL 기준으로 manifest를 먼저 지정하고, PWA 실행 시 role/pwa 파라미터를 최우선으로 보정합니다.
    -->
    <script>
      (function () {
        try {
          var path = (location && location.pathname) || '/';
          var search = (location && location.search) || '';
          var params = new URLSearchParams(search);
          var qRole = (params.get('role') || '').toLowerCase();
          var qPwa = (params.get('pwa') || '').toLowerCase();

          var mode = null;
          if (qPwa === 'player' || qRole === 'player' || path.indexOf('/player') === 0) {
            mode = 'player';
          } else if (qPwa === 'admin' || qRole === 'admin' || path.indexOf('/admin') === 0 || path === '/' || path.indexOf('/login') === 0) {
            mode = 'admin';
          }

          if (mode) {
            try {
              document.cookie = 'agm_mode=' + encodeURIComponent(mode) + '; Max-Age=31536000; Path=/; SameSite=Lax';
            } catch (e) {}
            try {
              localStorage.setItem('agm.installMode', mode);
              localStorage.setItem('agm.lastMode', mode);
            } catch (e) {}
          }

          var manifestFile = mode === 'player' ? 'manifest-player.json' : 'manifest-admin.json';
          var publicUrl = '%PUBLIC_URL%';
          if (!publicUrl || publicUrl === '%PUBLIC_URL%') publicUrl = '';
          var manifestHref = publicUrl + '/' + manifestFile + '?v=20260731-pwa-role-2';

          // 브라우저가 manifest를 읽기 전에 현재 경로에 맞는 manifest를 head에 먼저 삽입합니다.
          document.write('<link rel="manifest" href="' + manifestHref + '" />');

          var isStandalone = false;
          try {
            isStandalone =
              (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
              window.navigator.standalone === true;
          } catch (e) {}
          if (!isStandalone) return;

          // start_url에 명시된 role/pwa가 있으면 그 값을 최우선으로 사용합니다.
          if ((qPwa === 'player' || qRole === 'player') && path.indexOf('/player') !== 0) {
            location.replace('/player/login-or-code?pwa=player');
            return;
          }
          if ((qPwa === 'admin' || qRole === 'admin') && path.indexOf('/player') === 0) {
            location.replace('/login?role=admin&pwa=admin');
            return;
          }

          // role/pwa가 없는 구형 홈화면 아이콘 또는 캐시된 아이콘 보정용 fallback입니다.
          var m = document.cookie.match(/(?:^|;\s*)agm_mode=([^;]+)/);
          var savedMode = m ? decodeURIComponent(m[1]) : '';
          if (savedMode === 'player' && path.indexOf('/player') !== 0) {
            location.replace('/player/login-or-code?pwa=player');
            return;
          }
          if (savedMode === 'admin' && path.indexOf('/player') === 0) {
            location.replace('/login?role=admin&pwa=admin');
            return;
          }
        } catch (e) {}
      })();
    </script>

    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <!-- manifest는 위 초기 스크립트에서 현재 경로에 맞게 동적으로 삽입합니다. -->
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>React App</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
